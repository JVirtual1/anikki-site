<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anikki</title>
<meta name="color-scheme" content="dark light">
<style>
:root{--bg:#121212;--fg:#EDEDED;--sec:#9E9E9E;--acc:#C21F3A;--line:#2a2a2a}
@media (prefers-color-scheme:light){:root{--bg:#fbf8f6;--fg:#1c1c1c;--sec:#5f5f5f;--acc:#a8182f;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:42rem;margin:0 auto;padding:1.5rem 1rem 3rem}
h1{font-size:1.6rem;line-height:1.25;margin:.5rem 0 1rem}
h2{font-size:1.15rem;margin:2rem 0 .5rem}
h3{font-size:1rem;margin:1.25rem 0 .25rem}
a{color:var(--acc);overflow-wrap:anywhere}
.sec,.nav{color:var(--sec);font-size:.9rem}
table{border-collapse:collapse;width:100%;font-size:.92rem;display:block;overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:.4rem .5rem;text-align:left;vertical-align:top}
ul{padding-left:1.25rem}
</style>
</head>
<body>
<main>
<h1>404</h1>
<p>Diese Seite gibt es nicht. / This page does not exist.</p>
<p><a href="/">Anikki</a></p>
</main>
</body>
</html>
